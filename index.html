<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>규랩 (Gyu Lap)</title>
<meta name="description" content="규랩(Gyu Lap)은 모바일 게임과 앱을 만드는 1인 개발 스튜디오입니다.">
<style>
  :root { --bg:#f6f4ef; --ink:#1d1f22; --sub:#5c6168; --line:#d9d5cb; --accent:#2f5d62; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15171a; --ink:#ecebe6; --sub:#a3a8ae; --line:#2c3035; --accent:#7fb3b8; }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  main { max-width:680px; margin:0 auto; padding:96px 24px 64px; }
  .mark { font-size:14px; letter-spacing:.18em; color:var(--accent); font-weight:600; }
  h1 { font-size:44px; line-height:1.2; margin:12px 0 20px; letter-spacing:-.02em; }
  h1 span { color:var(--sub); font-weight:400; font-size:.55em; margin-left:.4em; letter-spacing:0; }
  .lead { font-size:19px; color:var(--sub); margin:0 0 56px; }
  section { border-top:1px solid var(--line); padding:28px 0; display:grid; grid-template-columns:120px 1fr; gap:16px; }
  h2 { font-size:14px; margin:4px 0 0; color:var(--sub); font-weight:600; letter-spacing:.04em; }
  ul { margin:0; padding:0; list-style:none; }
  li + li { margin-top:6px; }
  a { color:var(--accent); text-decoration:none; border-bottom:1px solid currentColor; }
  footer { border-top:1px solid var(--line); margin-top:8px; padding-top:24px; font-size:13px; color:var(--sub); }
  @media (max-width:520px) {
    main { padding-top:64px; }
    h1 { font-size:34px; }
    section { grid-template-columns:1fr; gap:6px; }
  }
</style>
</head>
<body>
<main>
  <div class="mark">GYU LAP</div>
  <h1>규랩<span>Gyu Lap</span></h1>
  <p class="lead">모바일 게임과 앱을 만드는 1인 개발 스튜디오입니다.</p>

  <section>
    <h2>하는 일</h2>
    <ul>
      <li>모바일 게임 개발 및 공급</li>
      <li>응용 소프트웨어(앱) 개발 및 공급</li>
    </ul>
  </section>

  <section>
    <h2>소재지</h2>
    <ul>
      <li>대한민국</li>
    </ul>
  </section>

  <section>
    <h2>문의</h2>
    <ul>
      <li><a href="mailto:contact@gyulap.com">contact@gyulap.com</a></li>
    </ul>
  </section>

  <footer>© 2026 규랩 (Gyu Lap)</footer>
</main>
</body>
</html>
